<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do App</title>
    <link rel="stylesheet" href="todoapp.css">
</head>

<body>
    <h1>Thank you varun!</h1>
    <div id="instr">
        <h2 id="header2">Instructions</h2>
        <ul id="instrList">
            <li>Add task: click 'Add Task' button;</li>
            <li>Complete task: click once on task;</li>
            <li>Delete task: double-click on task;</li>
        </ul>
    </div>
    <div id="todo-app">

        <h1 id="header">To Do List</h1>
        <form id="taskForm"> <input type="text" placeholder="What's today's task?" id="userinput">
            <button id="button">Add Task</button>

        </form>
        <ul id="list">
        </ul>

    </div>
    <script src="todoapp.js"></script>

</body>

</html>
